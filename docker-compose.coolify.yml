services:
  bitcoin-block-explorer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitcoin-block-explorer
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      BLOCKCHAIN_API_URL: ${BLOCKCHAIN_API_URL:-https://blockchain.info}
      BLOCKCHAIN_API_TOKEN: ${BLOCKCHAIN_API_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
